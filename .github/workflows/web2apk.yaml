name: Web2APK
run-name: Web2APK ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "URL website"
        required: true
      app_name:
        description: "Nama aplikasi"
        required: true
      icon_url:
        description: "URL icon (opsional)"
        required: false
      job_id:
        description: "ID job dari bot (otomatis)"
        required: false
        default: ""
      tag:
        description: "Tag (opsional, tidak dipakai)"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create app
        env:
          WEB_URL: ${{ inputs.web_url }}
          APP_NAME: ${{ inputs.app_name }}
          ICON_URL: ${{ inputs.icon_url }}
        run: |
          flutter create --org com.web2apk --project-name webapp app
          cd app
          flutter pub add webview_flutter
          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const MaterialApp(debugShowCheckedModeBanner: false, home: Home()));

          class Home extends StatefulWidget {
            const Home({super.key});
            @override
            State<Home> createState() => _HomeState();
          }

          class _HomeState extends State<Home> {
            late final WebViewController c;

            @override
            void initState() {
              super.initState();
              c = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse('__URL__'));
            }

            @override
            Widget build(BuildContext context) => Scaffold(
              body: SafeArea(
                child: PopScope(
                  canPop: false,
                  onPopInvokedWithResult: (didPop, _) async {
                    if (await c.canGoBack()) { c.goBack(); }
                  },
                  child: WebViewWidget(controller: c),
                ),
              ),
            );
          }
          DART
          python3 - <<'PY'
          import os,re
          url=os.environ['WEB_URL'].replace("\\","\\\\").replace("'","\\'").replace("$","\\$")
          p='lib/main.dart'; s=open(p).read().replace('__URL__',url); open(p,'w').write(s)
          name=re.sub(r'[<>"&]','',os.environ['APP_NAME'])
          m='android/app/src/main/AndroidManifest.xml'; s=open(m).read()
          s=re.sub(r'android:label="[^"]*"','android:label="%s"'%name,s,1)
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<application','<uses-permission android:name="android.permission.INTERNET"/>\n    <application',1)
          open(m,'w').write(s)
          PY
          if [ -n "$ICON_URL" ]; then
            mkdir -p assets
            if curl -fL "$ICON_URL" -o assets/icon.png; then
              flutter pub add dev:flutter_launcher_icons
              printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "assets/icon.png"\n' > flutter_launcher_icons.yaml
              dart run flutter_launcher_icons || true
            fi
          fi

      - name: Build APK
        working-directory: app
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          flutter build apk --release
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk "../out/${APP_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.job_id || github.run_id }}
          path: out/*
          retention-days: 3
          
